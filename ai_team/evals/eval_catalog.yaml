schema_version: "1.0"
purpose: "Measure candidate improvement without changing the caller runtime or inventing telemetry."
suites:
  agent:
    dimensions:
      - role_understanding
      - scope_adherence
      - capability_application
      - responsibility_boundary
      - handoff_quality
      - evidence_discipline
      - hallucination_resistance
      - done_definition_compliance
      - escalation_quality
      - reviewer_selection_quality
    deterministic_results: "ai_team/evals/agent_skill_fixtures.yaml"
  skill:
    dimensions:
      - correct_invocation
      - task_improvement
      - instruction_adherence
      - false_positive_avoidance
      - overlap_and_conflict
      - output_quality
      - context_efficiency
    deterministic_results: "ai_team/evals/agent_skill_fixtures.yaml"
    coverage_bindings: "ai_team/evals/skill_eval_bindings.yaml"
  engineering:
    fixture: "ai_team/evals/golden_cases.yaml"
    representative_results: "ai_team/evals/case_fixtures.yaml"
    representative_contract_execution: deterministic
    live_ai_task_execution: deferred
    live_ai_task_reason: "No provider/model switch or synthetic claim is allowed; collect real local execution evidence in later tasks."
  documentation:
    dimensions: [accuracy, completeness, freshness, stale_path, contradiction, duplication, canonical_source_mismatch, broken_link, role_skill_mismatch, stale_model_recommendation, responsibility_clarity, fragmentation, cross_document_consistency, discoverability, ai_readability, human_readability, implementation_alignment, maintainability]
  regression:
    rule: "A changed acceptance-contract digest is a Foundation migration, not a same-contract capability comparison."
    migration_comparison: "run_foundation_evals.py --baseline-root <path> --root <path>"
    same_contract_comparison: "run_foundation_evals.py --baseline-root <path> --root <path> --contract-root <fixed-contract-path>"
    contract_digest_surfaces: [runner, catalog, golden_cases, case_fixtures, agent_skill_fixtures, skill_bindings, documentation_schema, documentation_selector, documentation_validator, documentation_policy, risk_gates]
    synthetic_fixture_claim: foundation_contract_only
verdicts:
  foundation_contract:
    pass: "All deterministic structural contracts pass."
  capability_effectiveness:
    pass_requires: [live_execution_evidence, same_contract_before_after, independent_evaluator]
    absent_live_evidence: "UNKNOWN — insufficient evidence"
comparison_contract:
  required_fields:
    - baseline_revision
    - candidate_revision
    - runtime_evidence
    - case_results
    - independent_evaluator
  metrics:
    - task_success
    - p0_p1_findings
    - human_corrections
    - needs_fix
    - reviewer_findings
    - reproducibility
    - context_efficiency
  unavailable_measurement:
    value: null
    evidence_type: unavailable
  inferred_token_or_cost: forbidden
promotion_gate:
  require_no_regression_on_critical_cases: true
  require_independent_review: true
  require_celes_human_gate: true
