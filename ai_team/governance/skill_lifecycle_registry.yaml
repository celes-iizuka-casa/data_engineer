    from_revision: "sha256:8253da1c523e0441ddc471499fe4d70cb0131771b74488eeb9d3fdf590aa557f"
    subject_revision: "sha256:665d0e0425f3de574a54b5ba1a6be39b93379b2cd2d659032984c7a21112d561"
    target_state: ACTIVE
    disposition: UPDATE
