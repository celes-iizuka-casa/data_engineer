    before_after_eval_ref: "local-evidence:skill-surface-alignment-20260805/validator_drift_check"
    independent_review_ref: "local-review:skill-surface-alignment-20260805/quality_review_report"
    evidence_refs:
      - "tools/validate_repository.py"
      - "celes-instruction:20260805-skill-surface-alignment"
    notes: "SKILL.md (a revision_strategy.canonical_input) had drifted from the already-approved skill.yaml in 16 skills: declared steps/outputs/prohibited_actions/done_definition existed in the contract face but were missing from the face read at runtime. A new validator check (SKILL_MD_YAML_LIST_PAIRS) detected 31 such divergences; all were closed by editing SKILL.md only -- skill.yaml was not touched, so no contract semantics changed. Because SKILL.md feeds the content hash, each of the 16 revisions changed and required this gate. skill-agent-creation and skill-skill-creation were deliberately excluded (their Celes-HG-20260804 hashes would break); the exclusion is pinned in SKILL_MD_YAML_LIST_DRIFT_EXCEPTIONS. Independent review (Opus 5) verified all 16 edits semantically and recomputed 33/33 registry hashes independently; its P1-1 finding was the absence of this record. Open items not covered here: P2-1 (10 FDE sub-Skills still lack ## 完了条件), P2-2 (check compares counts, not order), P2-3 (SKILL.md headings not enforced), P2-4 (no direct unit test for the new parser). Covered skills (16, the exact set the subject_revision is computed over): skill-backend-engineer, skill-cloud-infrastructure-engineer, skill-data-engineer, skill-data-platform-engineer, skill-deliverable-quality-reviewer, skill-engineering-pmo, skill-field-discovery, skill-forward-deployed-engineer, skill-frontend-engineer, skill-fullstack-engineer, skill-integration-engineer, skill-llm-application-engineer, skill-ml-engineer, skill-product-manager, skill-security-governance-engineer, skill-sre-platform-engineer."
  - schema_version: "1.1"
    gate_id: "Celes-HG-20260805-SKILL-SURFACE-ALIGNMENT-2"
    decision_type: canonical_promotion
    subject_id: skill-surface-alignment-20260805-2
    from_revision: "sha256:665d0e0425f3de574a54b5ba1a6be39b93379b2cd2d659032984c7a21112d561"
    subject_revision: "sha256:2654b610e810ee3c196c94a9c7ff57a4a814c5a57fd7614306ae6b7122a1b5d1"
    target_state: ACTIVE
    disposition: UPDATE
    decision: PROMOTE
    decided_by: Celes
    timestamp: "2026-08-05T16:11:47+09:00"
    before_after_eval_ref: "local-evidence:skill-surface-alignment-20260805-2/validator_drift_check"
    independent_review_ref: "local-review:skill-surface-alignment-20260805-2/quality_review_report"
    evidence_refs:
      - "tools/validate_repository.py"
      - "ai_team/tests/test_ai_team_foundation.py"
      - "celes-instruction:20260805-skill-surface-alignment-2"
    notes: "Remediates the 5 open items the prior gate (Celes-HG-20260805-SKILL-SURFACE-ALIGNMENT) left unclosed. P2-1: all 10 FDE sub-Skills gained ## 完了条件 matching done_definition exactly. P2-2: an independent sweep found the prior review's own estimate wrong (it predicted 1 new failure under stricter comparison; the actual count was 20 skills / 31 items under strict text+order, 19/27 after normalization). A similarity-threshold approach was rejected as undecidable (real drift scored 0.079-0.39, benign decoration 0.39-0.99, overlapping); a containment rule (skill_item_matches, exact substring in either direction after normalization) was implemented instead and wired into validate_skills(), and SKILL_MD_YAML_LIST_DRIFT_EXCEPTIONS was deleted entirely -- all 4 previously-exempted Capability Architect skills now pass on their own merits. P2-3: SKILL_MD_REQUIRED_HEADINGS enforces 7 headings with a line-anchored match. P2-4: SkillSurfaceParityTests (8 cases) added. P3-1: parser hardened for */+ bullets, fenced blocks, and nesting (measured zero behavioral change across all 33 skills, so no risk). Only SKILL.md was edited in all 16 skills; skill.yaml is byte-identical to before (git diff confirms zero skill.yaml changes). Independent review (Opus 5, REWORK_REQUIRED 2.9/4.0) verified all of the above against real files and commands, not against the report's claims, and found one P1: after the hash resync the 16 entries' transition.human_gate_status had been left at 'promoted' from the prior gate while content was still unapproved, making the registry misrepresent unapproved content as already independently-reviewed and PROMOTEd. Fixed before this gate: active_revision was reset to the committed (HEAD) hash and candidate_state/human_gate_status were set to HUMAN_GATE/pending until this PROMOTE. Covered skills (16, the exact set subject_revision is computed over): skill-adoption-planning, skill-agent-creation, skill-agent-registry-management, skill-business-flow-mapping, skill-capability-gap-analysis, skill-engineering-handoff, skill-engineering-knowledge-curator, skill-engineering-pmo, skill-feedback-to-backlog, skill-field-discovery, skill-mvp-scoping, skill-pain-point-analysis, skill-skill-creation, skill-solution-framing, skill-stakeholder-mapping, skill-success-metrics-design. Open items not covered here (next cycle, per independent review P2/P3): no direct unit test for SKILL_MD_REQUIRED_HEADINGS / the skill_item_matches wiring itself; skill-agent-registry-management's 必須出力 bullets duplicate their bold subsection header verbatim, which is faithful but hurts SKILL.md readability."
