schema_version: "1.0"
registry_kind: "skill-lifecycle"
revision_strategy:
  algorithm: sha256
  canonical_inputs: [skill.yaml, SKILL.md, agents/openai.yaml]
  value_format: "sha256:<hex>"
  capture: "Each Skill entry stores baseline active_revision and current candidate_revision."
  batch_subject_revision:
    # Rule for last_promotion_decision.subject_revision / promotion_history[].subject_revision
    # when a single Human Gate decision covers multiple Skill entries at once.
    # Established 2026-08-05 (Phase E, local-capability-layer). The 2026-08-02
    # batch's subject_revision ("sha256:6cb23226c5...") predates this rule and
    # could not be reproduced from any ordering of the 4 skills' historical
    # content revisions during the Phase D re-review -- it is left as-is
    # (append-only) rather than retrofitted. This rule applies to batch
    # decisions recorded from 2026-08-05 onward.
    algorithm: sha256
    input: "For each covered Skill id sorted ascending: id (utf-8) + NUL + its candidate_revision string (utf-8) + NUL, concatenated in that order."
    value_format: "sha256:<hex>"
lifecycle_states: [DISCOVERED, PROPOSED, CANDIDATE, EVALUATED, INDEPENDENTLY_REVIEWED, HUMAN_GATE, ACTIVE, DEPRECATED]
dispositions: [CREATE, KEEP, UPDATE, MERGE, SPLIT, DEPRECATE, UNKNOWN]
transition_record_contract:
  required_fields: [from_state, to_state, candidate_revision, evidence_refs, independent_review_ref, human_gate_status]
  human_gate_status: [not_required, pending, promoted, rejected, rework, rolled_back]
  rule: "ACTIVE promotion requires independent review and Celes Human Gate; baseline imports retain their active_revision."
decision_rules:
  no_usage_is_not_deprecation_evidence: true
  new_skill_requires:
    - evidenced_capability_gap
    - existing_skill_cannot_resolve
    - not_agent_workflow_documentation_or_tooling_root_cause
    - reusable
    - evaluable
baseline:
  repository_head: "5817a81b4e2e048b8ed16c8c98355e67a7f46e57"
  observed_on: "2026-07-14"
  usage_evidence: unavailable
candidate:
  # Describes the most recent governed change batch, not the total entry count.
  # Every Skill entry always carries a candidate_state (the Skill schema has no
  # "no candidate" steady state -- unlike the Role registry, validate_repository.py
  # requires candidate_state to be one of lifecycle_states, so null is invalid).
  # changed_skills therefore counts the Skills this batch actually changed.
  source: "Celes-instructed local capability layer separation (request of 2026-08-04)"
  purpose: "Layer-gate the 4 Capability Architect skills (gap analysis, agent creation, skill creation, registry management) so derived environments never write to the shared core"
  human_gate_status: promoted
  changed_skills: 4
  effectiveness: not_evaluated
  improvement_type: structural_contract
  effectiveness_claim: "UNKNOWN — insufficient live evidence"
current_candidate_decision: null
