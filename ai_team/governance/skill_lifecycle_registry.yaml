    before_after_eval_ref: "local-evidence:skill-surface-alignment-20260805/validator_drift_check"
    independent_review_ref: "local-review:skill-surface-alignment-20260805/quality_review_report"
    evidence_refs:
      - "tools/validate_repository.py"
      - "celes-instruction:20260805-skill-surface-alignment"
    notes: "SKILL.md (a revision_strategy.canonical_input) had drifted from the already-approved skill.yaml in 16 skills: declared steps/outputs/prohibited_actions/done_definition existed in the contract face but were missing from the face read at runtime. A new validator check (SKILL_MD_YAML_LIST_PAIRS) detected 31 such divergences; all were closed by editing SKILL.md only -- skill.yaml was not touched, so no contract semantics changed. Because SKILL.md feeds the content hash, each of the 16 revisions changed and required this gate. skill-agent-creation and skill-skill-creation were deliberately excluded (their Celes-HG-20260804 hashes would break); the exclusion is pinned in SKILL_MD_YAML_LIST_DRIFT_EXCEPTIONS. Independent review (Opus 5) verified all 16 edits semantically and recomputed 33/33 registry hashes independently; its P1-1 finding was the absence of this record. Open items not covered here: P2-1 (10 FDE sub-Skills still lack ## 完了条件), P2-2 (check compares counts, not order), P2-3 (SKILL.md headings not enforced), P2-4 (no direct unit test for the new parser). Covered skills (16, the exact set the subject_revision is computed over): skill-backend-engineer, skill-cloud-infrastructure-engineer, skill-data-engineer, skill-data-platform-engineer, skill-deliverable-quality-reviewer, skill-engineering-pmo, skill-field-discovery, skill-forward-deployed-engineer, skill-frontend-engineer, skill-fullstack-engineer, skill-integration-engineer, skill-llm-application-engineer, skill-ml-engineer, skill-product-manager, skill-security-governance-engineer, skill-sre-platform-engineer."
