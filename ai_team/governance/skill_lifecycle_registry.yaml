lifecycle_states: [DISCOVERED, PROPOSED, CANDIDATE, EVALUATED, REVIEWED, HUMAN_GATE, ACTIVE, DEPRECATED]
dispositions: [KEEP, UPDATE, MERGE, SPLIT, DEPRECATE, UNKNOWN]
transition_record_contract:
