schema_version: "1.0"
registry_kind: "provider-neutral-role-capabilities"
score_policy:
  numeric_scores_without_evidence: forbidden
  allowed_evaluation_states: [not_evaluated, baseline_pending, evaluated]
common_contract:
  runtime_binding: caller_runtime
  provider_binding: none
  required_evidence:
    - current_explicit_request
    - current_repository_or_data
    - assumptions_and_unknowns
    - validation_results
  required_reviewers:
    - role: deliverable_quality_reviewer
      when: risk_requires_independent_review
  done_definition:
    - role_specific_done_definition_satisfied
    - executed_and_unexecuted_tests_disclosed
    - residual_risks_disclosed
    - required_handoffs_completed
roles:
  - id: engineering_pmo
    display_name: "AI Engineering PMO"
    role_document: "ai_team/roles/engineering_pmo.md"
    primary_skill: skill-engineering-pmo
    ownership:
      owns_ref: "ai_team/roles/engineering_pmo.md#守備範囲"
      does_not_own_ref: "ai_team/roles/engineering_pmo.md#責任を持たない領域"
    capabilities:
      task_analysis: {criticality: high, evaluation: not_evaluated}
      team_orchestration: {criticality: high, evaluation: not_evaluated}
      evidence_discipline: {criticality: high, evaluation: not_evaluated}
      documentation: {criticality: medium, evaluation: not_evaluated}
      collaboration_handoff: {criticality: high, evaluation: not_evaluated}
    decision_rights:
      - "依頼を分類し、必要最小限のRoleとGateを選定する"
      - "Role別材料をoutput.mdへ統合する"
    escalation_conditions:
      - "専門ReviewerのP0/P1または未解決Blocker"
      - "Canonical promotionまたは不可逆操作"
    supported_task_types: [task_planning, cross_role_coordination, deliverable_integration]
    unsuitable_task_types: [specialist_technical_approval, implementation_ownership]
    handoff_rules_ref: "ai_team/roles/engineering_pmo.md#他Roleへ渡す条件"
    done_definition_ref: "ai_team/roles/engineering_pmo.md#完了条件"
