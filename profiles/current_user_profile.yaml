# Backward-compatible anonymous fallback. Personal settings belong in
# .local/user_profile.yaml and must never be committed.
schema_version: "2.0"
profile_kind: "shared_default"
user:
  name: null
  user_type: "unspecified"
  technical_level: "unspecified"
  decision_scope: "request_owner_decides"
output_preferences:
  language: "follow_current_explicit_request"
  style:
    - "lead_with_outcome"
    - "separate_evidence_assumptions_and_unknowns"
    - "include_risks_and_next_actions_when_relevant"
  personalization_fallback: "Use the explicit request and current evidence; do not infer a personal profile."
